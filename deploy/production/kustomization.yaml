apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: idpam-demo

resources:
  - namespace.yaml
  - dex-config.yaml
  - workload.yaml
  - service.yaml
  - network-policy.yaml
  - httproute.yaml

# Production is pinned only after the three images pass tests and scans.
images:
  - name: registry.gitlab.com/febef.dev/idpam
    newTag: v0.2.3
  - name: registry.gitlab.com/febef.dev/idpam/ldap
    newTag: v0.2.3
  - name: registry.gitlab.com/febef.dev/idpam/ca
    newTag: v0.2.3

labels:
  - pairs:
      app.kubernetes.io/name: idpam-demo
      app.kubernetes.io/part-of: domus-demos
      app.kubernetes.io/managed-by: argocd
    includeSelectors: false
