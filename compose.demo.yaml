# Local-only demo, deliberately separate from the historical docker-compose.yml.
services:
  demo-ca:
    image: idpam-demo-ca:local
    volumes:
      - ldap-certs:/certs
      - ldap-ca:/ca
    networks: [demo]

  ldap:
    image: idpam-demo-ldap:local
    hostname: ldap
    depends_on:
      demo-ca:
        condition: service_completed_successfully
    volumes:
      - ldap-certs:/certs:ro
    tmpfs:
      - /var/lib/openldap/openldap-data:size=67108864,mode=0700,uid=100,gid=101
      - /run/openldap:size=1048576,mode=0755,uid=100,gid=101
    networks: [demo]

  dex:
    image: ghcr.io/dexidp/dex:v2.45.1@sha256:8499afd690c437f52301efd2b05b2455da5bd2dfc20332cd697dc9937f808462
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    depends_on:
      ldap:
        condition: service_started
    environment:
      DEX_CONTINUE_ON_CONNECTOR_FAILURE: "false"
    volumes:
      - ./demo/dex/config.yaml:/etc/dex/config.yaml:ro
      - ldap-ca:/etc/dex/ldap-ca:ro
    tmpfs:
      - /var/dex:size=33554432,mode=0700,uid=1001,gid=1001
    ports:
      - "127.0.0.1:5556:5556"
    networks: [demo, frontend]

  mongo:
    image: mongo:7.0@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca
    # FTDC writes frequent archive files that are unnecessary in this
    # disposable tmpfs lab and can fail on Docker Desktop's tmpfs adapter.
    command: ["mongod", "--bind_ip_all", "--quiet", "--setParameter", "diagnosticDataCollectionEnabled=false"]
    tmpfs:
      - /data/db:size=268435456,mode=1777
    networks: [demo]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    image: idpam-demo:local
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      IDPAM_DEMO_MODE: "1"
      MONGODB_URI: mongodb://mongo:27017/idpam_demo
      BIND_HOST: 0.0.0.0
      PORT: "3000"
      RESET_INTERVAL_SECONDS: ${RESET_INTERVAL_SECONDS:-3600}
    ports:
      - "127.0.0.1:3000:3000"
    networks: [demo, frontend]

networks:
  demo:
    internal: true
  frontend: {}

volumes:
  ldap-certs: {}
  ldap-ca: {}
